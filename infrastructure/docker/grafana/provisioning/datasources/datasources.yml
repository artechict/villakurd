# VillaKurd - Grafana Datasources Provisioning
# Place at: infrastructure/docker/grafana/provisioning/datasources/datasources.yml

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: "traceId"
          matcherRegex: "traceId=(\\w+)"
          url: "http://jaeger:16686/trace/$${__value.raw}"
          datasourceUid: "jaeger"

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: "loki"
        tags: ["traceId", "spanId"]
      nodeGraph:
        enabled: true

# Additional datasources for specific services
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: villakurd
    user: villakurd
    secureJsonData:
      password: "${DB_PASSWORD}"
    jsonData:
      sslmode: "disable"
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "[villakurd-]YYYY.MM.DD"
    jsonData:
      interval: "Daily"
      timeField: "@timestamp"
      esVersion: 80
      maxConcurrentShardRequests: 5
    secureJsonData:
      user: "elastic"
      password: "${ELASTIC_PASSWORD}"
    editable: false