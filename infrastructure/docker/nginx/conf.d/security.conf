# VillaKurd - Nginx Security Configuration
# Additional security configurations

# Block common exploit attempts
location ~* \.(sql|bak|backup|old|orig|tmp|temp|log|swp)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block access to version control
location ~ /\.(git|svn|hg) {
    deny all;
    access_log off;
    log_not_found off;
}

# Block access to config files
location ~* \.(env|conf|config|ini|yml|yaml)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block common malicious user agents
if ($http_user_agent ~* (sqlmap|nikto|w3af|acunetix|netsparker|burp|zap|dirb|gobuster|wfuzz|hydra|medusa|ncrack|patator)) {
    return 403;
}

# Block common exploit paths
location ~* (wp-admin|wp-login|xmlrpc|phpmyadmin|adminer|\.git|composer\.json|package\.json|\.env) {
    return 404;
}

# Limit request size for uploads
client_max_body_size 20M;