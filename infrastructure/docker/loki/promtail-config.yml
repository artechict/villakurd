# VillaKurd - Promtail Configuration
# Place at: infrastructure/docker/loki/promtail-config.yml

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            container_name: container_name
            container_id: container_id
            image: image
            level: level
            message: message
            timestamp: time
      - labels:
          container_name:
          container_id:
          image:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # Application logs (backend)
  - job_name: villakurd-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: villakurd-backend
          service: backend
          environment: production
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: msg
            timestamp: time
            request_id: reqId
            user_id: userId
            method: method
            url: url
            status_code: statusCode
            response_time: responseTime
      - labels:
          level:
          service:
          environment:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # Nginx access logs
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          service: nginx
          environment: production
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)" (?P<request_time>\S+) (?P<upstream_connect_time>\S+) (?P<upstream_header_time>\S+) (?P<upstream_response_time>\S+)'
      - labels:
          remote_addr:
          status:
          request_time:
          upstream_response_time:
      - timestamp:
          source: time_local
          format: "02/Jan/2006:15:04:05 -0700"
      - metrics:
          http_requests_total:
            type: Counter
            description: "Total HTTP requests"
            source: status
            config:
              action: increment
              match_all: true

  # Nginx error logs
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          service: nginx
          environment: production
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<message>.*)'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: "2006/01/02 15:04:05"

  # System logs (journald)
  - job_name: systemd-journal
    journal:
      json: false
      max_age: 12h
      labels:
        job: systemd-journal
      path: /var/log/journal

  # Audit logs
  - job_name: audit-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: audit-logs
          service: audit
          environment: production
          __path__: /var/log/audit/audit.log